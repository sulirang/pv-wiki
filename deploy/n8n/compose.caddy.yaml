services:
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - automation

volumes:
  caddy_data:
  caddy_config:
