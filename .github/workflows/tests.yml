name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Compile
        run: python -m compileall -q skills/wikijs-sync-products/scripts
      - name: Test runtime and integrations
        run: python -m unittest discover -s tests -v
      - name: Test PostgreSQL and state adapters
        run: python -m unittest discover -s skills/wikijs-sync-products/tests -v
