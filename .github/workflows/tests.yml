name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Compile
        run: python -m compileall -q skills/wikijs-sync-products/scripts
      - name: Test runtime and integrations
        run: python -m unittest discover -s tests -v
      - name: Test PostgreSQL and state adapters
        run: python -m unittest discover -s skills/wikijs-sync-products/tests -v
