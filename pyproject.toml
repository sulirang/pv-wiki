[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-wiki"
version = "0.4.0"
description = "An n8n-scheduled worker that researches PostgreSQL products and maintains cited Wiki.js pages."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sulirang"}]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5.9,<7",
]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7"]

[project.scripts]
pv-wiki = "pv_wiki.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/wikijs-sync-products/scripts"}

[tool.setuptools.packages.find]
where = ["skills/wikijs-sync-products/scripts"]

[tool.setuptools.package-data]
pv_wiki = ["suppliers.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/wikijs-sync-products/tests"]
addopts = "-q"
