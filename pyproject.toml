[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-wiki"
version = "0.4.0"
description = "A Hermes-scheduled product research pipeline with pooled Exa MCP access and idempotent Wiki.js publishing."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sulirang"}]
dependencies = [
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7"]

[project.scripts]
pv-wiki = "pv_wiki.cli:main"
pv-wiki-exa-mcp = "pv_wiki.exa_mcp:main"
pv-wiki-research-mcp = "pv_wiki.research_mcp:main"
pv-wiki-catalogue-mcp = "pv_wiki.catalogue_mcp:main"
pv-wiki-publish-researched = "pv_wiki.hermes_store:main_publish"

[tool.setuptools]
package-dir = {"" = "skills/wikijs-sync-products/scripts"}

[tool.setuptools.packages.find]
where = ["skills/wikijs-sync-products/scripts"]

[tool.setuptools.package-data]
pv_wiki = ["suppliers.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/wikijs-sync-products/tests"]
addopts = "-q"
